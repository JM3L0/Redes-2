services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: redes2_server
    hostname: server
    cap_add:
      - NET_ADMIN
    networks:
      redes2_net:
        ipv4_address: 172.28.0.10
    ports:
      - "443:443/tcp"
      - "443:443/udp"
      - "5201:5201/tcp"
      - "5201:5201/udp"
    volumes:
      - ../data/static:/var/www/html:ro
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: redes2_client
    hostname: client
    cap_add:
      - NET_ADMIN
    networks:
      redes2_net:
        ipv4_address: 172.28.0.20
    volumes:
      - ../data:/workspace/data
      - ../scripts:/workspace/scripts
      - ../analysis:/workspace/analysis
    depends_on:
      - server
    stdin_open: true
    tty: true

networks:
  redes2_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
          gateway: 172.28.0.1
